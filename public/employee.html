<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Panel | Airindiana CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge">AI</div>
        <div>
          <h2>Airindiana Employee Panel</h2>
          <small id="employeeIdentity"></small>
        </div>
      </div>
      <div class="actions">
        <a href="./track.html" class="btn btn-secondary">Applicant Track Page</a>
        <button id="logoutBtn" class="btn btn-danger">Logout</button>
      </div>
    </header>

    <section class="grid-2" style="margin-top: 22px;">
      <div class="card">
        <h3>New Applicant Entry</h3>
        <form id="applicantForm" enctype="multipart/form-data">
          <div class="form-grid">
            <div>
              <label>Full Name</label>
              <input name="fullName" required />
            </div>
            <div>
              <label>Email</label>
              <input name="email" type="email" required />
            </div>
            <div>
              <label>Mobile Number</label>
              <input name="mobile" required />
            </div>
            <div>
              <label>Gender</label>
              <select name="gender" required>
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
              </select>
            </div>
            <div>
              <label>Date of Birth</label>
              <input name="dob" type="date" required />
            </div>
            <div>
              <label>Job Position</label>
              <input name="jobPosition" placeholder="Airport Ground Staff" required />
            </div>
            <div class="full">
              <label>Address</label>
              <textarea name="address" required></textarea>
            </div>
            <div class="full">
              <label>Photo Upload (JPG/PNG/WEBP, max 2MB)</label>
              <input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required />
            </div>
          </div>
          <button class="btn btn-primary" type="submit" style="margin-top: 10px;">Submit Application</button>
        </form>
        <div id="formMessage"></div>
      </div>

      <div class="card">
        <h3>Token / Reference Generated</h3>
        <p class="muted">After submit, share the generated reference number with applicant.</p>
        <h2 id="generatedRef">-</h2>
        <button id="copyRefBtn" class="btn btn-secondary" type="button">Copy Reference</button>
        <div id="copyMsg" class="footer-note"></div>
      </div>
    </section>

    <section class="card" style="margin-top: 20px;">
      <h3>My Submitted Applicants</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Ref</th>
              <th>Name</th>
              <th>Contact</th>
              <th>Position</th>
              <th>Status</th>
              <th>Photo</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody id="myApplicantsBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="./js/api.js"></script>
  <script src="./js/employee.js"></script>
</body>
</html>
